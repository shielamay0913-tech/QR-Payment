<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay</title>
<style>
:root{--blue:#0a5be0;--ink:#0b1e5b;--muted:#7a869a;--line:#e3e9f5;--bg:#f4f7fd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--blue);color:var(--ink)}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;position:relative;padding:6px 0 14px}
.top .x{position:absolute;left:0;top:2px;background:none;border:0;color:#fff;font-size:26px;line-height:1;display:none}
.badge{background:#ffd54a;color:#4a3b00;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;text-align:center;margin:0 auto 12px;display:table}
.app>section{margin:auto 0;padding-bottom:40px}
.card{background:#fff;border-radius:22px;padding:18px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;background:var(--blue);color:#fff;margin-top:12px}
.btn.light{background:#eaf1ff;color:var(--blue)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#0b1e5b;aspect-ratio:1/1;display:none}
.vid video{width:100%;height:100%;object-fit:cover}
.vid i{position:absolute;inset:18%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
label{font-size:12px;font-weight:700;display:block;margin:14px 0 6px}
input[type=number],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:18px;font-weight:700;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1.5px solid var(--line);font-weight:700}
.row:last-of-type{border-bottom:0}
.who{text-align:center;padding-top:30px}
.who h2{margin:0;color:#0b2bb0;font-size:26px;letter-spacing:.5px}
.pill{display:inline-block;background:#eef2fb;border-radius:99px;padding:9px 18px;font-weight:800;font-size:19px;margin-top:12px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--blue);border:4px solid #fff;display:grid;place-items:center;margin:0 auto -34px;position:relative;z-index:1}
.tick svg{width:30px;height:30px}
.rcpt{background:#fff;border-radius:22px 22px 0 0;padding:0 18px}
.foot{background:#f4f7fd;margin:0 -18px;padding:16px 18px 26px;display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.foot b{font-size:16px}
.zig{height:12px;background:linear-gradient(135deg,transparent 50%,#f4f7fd 50%) 0 0/16px 12px,linear-gradient(225deg,transparent 50%,#f4f7fd 50%) 0 0/16px 12px;background-repeat:repeat-x;transform:rotate(180deg);margin:0 0 0}
.big{font-size:30px;font-weight:900}
.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:#12b76a;color:#fff;border-radius:14px;padding:13px 16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .35s;z-index:9}
.toast.on{transform:translateY(0)}
.toast small{display:block;font-weight:600;opacity:.95;margin-top:2px}
.hist{margin-top:14px;color:#fff}
.hist h4{margin:0 0 8px;font-size:13px;opacity:.9}
.hi{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.err{color:#c0262d;font-weight:700;font-size:13px;margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <div class="top"><button class="x" id="back" onclick="home()" aria-label="Back">×</button><span id="ttl">Pay</span></div>

  <!-- SCAN -->
  <section id="vScan">
    <div class="card">
      <div class="vid" id="vid"><video id="cam" playsinline muted></video><i></i></div>
      <button class="btn" id="bCam" onclick="startCam()">Scan via QR code</button>
      <button class="btn light" onclick="document.getElementById('fil').click()">Upload a QR image</button>
      <input type="file" id="fil" accept="image/*" class="hide" onchange="fromFile(this)">
      <div class="err" id="err"></div>
      <label>Quick pay</label>
      <div class="chips">
        <button class="chip" onclick="useSample(0)">NCSSC Office</button>
        <button class="chip" onclick="useSample(1)">FITS Office</button>
        <button class="chip" onclick="useSample(2)">University Fines</button>
      </div>
    </div>
    <div class="hist" id="hist"></div>
  </section>

  <!-- CONFIRM -->
  <section id="vPay" class="hide">
    <div class="card">
      <div style="font-size:12px;color:var(--muted);font-weight:700">Send to</div>
      <div style="font-size:22px;font-weight:900;margin-top:4px" id="pName"></div>
      <div class="hint" id="pSub"></div>
      <label for="amt">Amount (₱)</label>
      <input type="number" id="amt" inputmode="decimal" min="1" step="0.01" placeholder="0.00">
      <div class="chips"><button class="chip" onclick="setAmt(25)">25</button><button class="chip" onclick="setAmt(50)">50</button><button class="chip" onclick="setAmt(100)">100</button><button class="chip" onclick="setAmt(600)">600</button></div>
      <div class="err" id="err2"></div>
      <button class="btn" onclick="send()">Send</button>
      <button class="btn light" onclick="home()">Cancel</button>
    </div>
  </section>

  <!-- SUCCESS -->
  <section id="vOk" class="hide">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="rcpt">
      <div class="who"><h2 id="rName"></h2><div class="pill" id="rNum"></div><div class="hint" id="rVia" style="margin-top:12px"></div></div>
      <div style="margin-top:22px;border-top:1.5px solid var(--line)">
        <div class="row"><span>Amount</span><span id="rAmt"></span></div>
        <div class="row" style="border-bottom:0"><span>Total Amount Sent</span><span class="big" id="rTot"></span></div>
      </div>
      <div class="foot"><div>Ref No. <b id="rRef"></b></div><div id="rDate"></div>
        <div style="width:100%;color:var(--muted)">Paid to: <span id="rOff"></span></div></div>
    </div>
    <div class="zig"></div>
    <button class="btn ghost" onclick="copyRef()" id="bCopy">Copy Ref No. (13 digits)</button>
    <button class="btn" style="background:#fff;color:var(--blue)" onclick="home()">Done</button>
  </section>
</div>

<script>
const SAMPLES=[
 'SAMPLE ONLY|NCSSC Office|GCash|Angela M. Rivera|09171230001',
 'SAMPLE ONLY|FITS Office|GCash|Paolo R. Mendoza|09171230002',
 'SAMPLE ONLY|University Fines Office|GCash|Jessa T. Villanueva|09171230003'];
const $=id=>document.getElementById(id);
let cur=null,last=null,stream=null,timer=null,det=null,jsq=null,HK='demopay-history';

function show(v){['vScan','vPay','vOk'].forEach(x=>$(x).classList.toggle('hide',x!==v));
  $('back').style.display=v==='vScan'?'none':'block';
  $('ttl').textContent=v==='vScan'?'Pay':v==='vPay'?'Send money':'Payment successful'}
function home(){stopCam();$('err').textContent='';$('err2').textContent='';show('vScan');renderHist()}

function mask(n){const p=n.trim().split(/\s+/);const f=p[0],l=p[p.length-1];
  const m=f.length>3?f.slice(0,2)+'••'+f.slice(-1):f[0]+'••';return (m+' '+l[0]+'.').toUpperCase()}
function fmtNum(n){const d=n.replace(/\D/g,'').replace(/^0/,'');return '+63 '+d.slice(0,3)+' '+d.slice(3,6)+' '+d.slice(6)}
function peso(x){return x.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function refNo(){let s='';for(let i=0;i<13;i++)s+=Math.floor(Math.random()*10);return s}
function fmtRef(r){return r.slice(0,4)+' '+r.slice(4,7)+' '+r.slice(7)}
function fmtDate(d){const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  let h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return m+' '+String(d.getDate()).padStart(2,'0')+', '+d.getFullYear()+' '+String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' '+ap}

function handle(text){
  const p=String(text||'').split('|');
  if((p[0]!=='SAMPLE ONLY'&&p[0]!=='PAY')||p.length<5){$('err').textContent='Invalid QR code. Please scan a valid payment QR.';return false}
  stopCam();$('err').textContent='';
  cur={office:p[1],method:p[2],name:p[3],number:p[4]};
  $('pName').textContent=cur.name;$('pSub').textContent=cur.method+' · '+fmtNum(cur.number)+' · '+cur.office;
  $('amt').value='';$('err2').textContent='';show('vPay');return true}
function useSample(i){handle(SAMPLES[i])}
function setAmt(v){$('amt').value=v}

function send(){
  const a=parseFloat($('amt').value);
  if(!(a>0)){$('err2').textContent='Please enter the amount to send.';return}
  const now=new Date(),ref=refNo();
  last={office:cur.office,name:cur.name,number:cur.number,amount:a,ref:ref,date:fmtDate(now)};
  $('rName').textContent=mask(cur.name);$('rNum').textContent=fmtNum(cur.number);
  $('rVia').textContent='Sent via Pay';
  $('rAmt').textContent=peso(a);$('rTot').textContent='₱'+peso(a);
  $('rRef').textContent=fmtRef(ref);$('rDate').textContent=last.date;$('rOff').textContent=cur.office;
  $('bCopy').textContent='Copy Ref No. (13 digits)';
  saveHist(last);show('vOk');notifyOk(last)}

function notifyOk(r){
  const t=$('toast');t.innerHTML='Payment successful<small>₱'+peso(r.amount)+' sent to '+mask(r.name)+' · Ref '+fmtRef(r.ref)+'</small>';
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),4200);
  try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36)}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('Payment successful',{body:'₱'+peso(r.amount)+' · Ref '+r.ref})}catch(e){}}
function copyRef(){const r=last.ref;const ok=()=>{$('bCopy').textContent='Copied: '+r};
  try{navigator.clipboard.writeText(r).then(ok,()=>fb())}catch(e){fb()}
  function fb(){const i=document.createElement('input');i.value=r;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){}i.remove();ok()}}

function saveHist(r){try{const l=JSON.parse(localStorage.getItem(HK)||'[]');l.unshift(r);localStorage.setItem(HK,JSON.stringify(l.slice(0,15)))}catch(e){}}
function renderHist(){let l=[];try{l=JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){}
  $('hist').innerHTML=l.length?'<h4>Recent payments</h4>'+l.map(r=>'<div class="hi"><span>'+r.office+'<br>'+r.date+'</span><span style="text-align:right">₱'+peso(r.amount)+'<br>Ref '+fmtRef(r.ref)+'</span></div>').join(''):''}

/* ---- QR reading ---- */
function loadJsQR(){return jsq=jsq||new Promise((ok,no)=>{if(window.jsQR)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=ok;s.onerror=()=>{jsq=null;no()};document.head.appendChild(s)})}
async function readSource(src,w,h){
  if('BarcodeDetector' in window){try{det=det||new BarcodeDetector({formats:['qr_code']});const r=await det.detect(src);if(r.length)return r[0].rawValue}catch(e){}}
  try{await loadJsQR()}catch(e){return null}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h),q=window.jsQR(d.data,w,h);return q?q.data:null}
async function startCam(){
  $('err').textContent='';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}
  catch(e){$('err').textContent='Camera is not available. Please upload a QR image instead.';return}
  const v=$('cam');v.srcObject=stream;await v.play();$('vid').style.display='block';$('bCam').textContent='Scanning… point at the QR code';
  timer=setInterval(async()=>{if(!v.videoWidth)return;const t=await readSource(v,v.videoWidth,v.videoHeight);if(t&&handle(t)){}},300)}
function stopCam(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('vid').style.display='none';$('bCam').textContent='Scan via QR code'}
async function fromFile(inp){const f=inp.files[0];inp.value='';if(!f)return;$('err').textContent='';
  try{const bmp=await createImageBitmap(f);const t=await readSource(bmp,bmp.width,bmp.height);
    if(!t)$('err').textContent='Could not read a QR code from that image. Try a clearer one.';else handle(t)}
  catch(e){$('err').textContent='Could not open that image.'}}
home();
</script>
</body>
</html>
